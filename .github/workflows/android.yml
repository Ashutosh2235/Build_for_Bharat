name: android
# Builds an installable debug APK on every push (and on demand: Actions tab → android → Run workflow).
# Download it from the run page → Artifacts → "scamshield-debug-apk".
on:
  push:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", "shared/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: android}}
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      # Optional: baked-in server; can also be set later in the app (Settings → Server)
      SCAMSHIELD_API_BASE_URL: ${{ vars.SCAMSHIELD_API_BASE_URL }}
      SCAMSHIELD_API_KEY: ${{ secrets.SCAMSHIELD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Assets match shared rules
        working-directory: .
        run: pip install pyyaml && python tools/export_rules.py --check
      - run: chmod +x gradlew   # exec bit is lost when pushing from Windows
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: scamshield-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env: {KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}"}
        run: echo "$KS" | base64 -d > app/release.keystore
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with: {name: scamshield-release-apk, path: android/app/build/outputs/apk/release/*.apk}
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with: {files: "android/app/build/outputs/apk/release/*.apk"}
